# 로컬 실행 전용. 기본값은 .env.example의 로컬 기본값과 일치시킨다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/board}
    username: ${DB_USERNAME:board}
    password: ${DB_PASSWORD:board}
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
